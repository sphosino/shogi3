<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三人将棋AI ブラウザ推論ベンチ</title>
<style>
  :root { --bg:#fbfaf6; --fg:#1d1c19; --sub:#55524a; --rule:#dedbd0; --accent:#2a78d6; --ok:#1a7f37; --ng:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a19; --fg:#f4f2ea; --sub:#c3c2b7; --rule:#3a3934; --accent:#3987e5; --ok:#3fb950; --ng:#f0883e; } }
  body { background:var(--bg); color:var(--fg); font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; margin:0; line-height:1.7; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--sub); margin:6px 0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0; }
  select, button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--rule); background:var(--bg); color:var(--fg); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; margin-top:8px; }
  th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--rule); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--sub); font-weight:400; font-size:13px; }
  #log { white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--sub); }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
</style>
</head>
<body>
<main>
  <h1>三人将棋AI ブラウザ推論ベンチ</h1>
  <p>学習したネットを、このブラウザ（WebGPU = このPCのGPU、または WebAssembly = CPU）で動かして、1回の推論にかかる時間を測ります。ブラウザ版を作るときに、1手に何回探索できるかの目安にします。</p>
  <p id="env"></p>
  <div class="row">
    <label>ネット <select id="model">
      <option value="models/pbig2-gen140.onnx">pbig2 世代140（12ブロック×160ch、22MB）</option>
      <option value="models/pmix-gen141.onnx">pmix 世代141（10ブロック×128ch、12MB）</option>
    </select></label>
    <label>計算 <select id="ep">
      <option value="webgpu">WebGPU（GPU）</option>
      <option value="wasm">WebAssembly（CPU）</option>
    </select></label>
    <button id="run">測る</button>
  </div>
  <table>
    <thead><tr><th>条件</th><th>まとめる局面数</th><th>1回の時間</th><th>1秒あたりの局面</th><th>800回探索の目安</th></tr></thead>
    <tbody id="out"></tbody>
  </table>
  <p>「800回探索の目安」は、探索で局面を何個ずつまとめて推論できるかによって変わります。1個ずつ（いちばん単純な作り）なら上の段、8〜16個ずつまとめられる作りなら下の段に近づきます。</p>
  <div id="log"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.js"></script>
<script src="bench_states.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const log = (s) => { $("log").textContent += s + "\n"; };
  ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/";
  $("env").textContent = "WebGPU: " + ("gpu" in navigator ? "使える可能性あり" : "このブラウザでは使えません") +
    "　/ CPUのスレッド数: " + (navigator.hardwareConcurrency || "?") +
    (self.crossOriginIsolated ? "" : "（WebAssembly は1スレッドで動きます）");

  function batch(n) {
    const a = new Uint8Array(n * 109);
    for (let i = 0; i < n; i++) a.set(BENCH_STATES.subarray((i % 64) * 109, (i % 64 + 1) * 109), i * 109);
    return new ort.Tensor("float32", Float32Array.from(a), [n, 109]);
  }

  async function measure(sess, n, reps) {
    const feeds = { states: batch(n) };
    for (let i = 0; i < 3; i++) await sess.run(feeds);  // 準備運転
    const t = performance.now();
    for (let i = 0; i < reps; i++) await sess.run(feeds);
    return (performance.now() - t) / reps;
  }

  $("run").onclick = async () => {
    $("run").disabled = true;
    const model = $("model").value, ep = $("ep").value;
    const label = $("model").selectedOptions[0].text.split("（")[0] + " / " + $("ep").selectedOptions[0].text;
    try {
      log(`読み込み中: ${model}（${ep}）`);
      const t0 = performance.now();
      const sess = await ort.InferenceSession.create(model, { executionProviders: [ep] });
      log(`読み込み ${((performance.now() - t0) / 1000).toFixed(1)}秒`);
      for (const n of [1, 8, 16, 64]) {
        const ms = await measure(sess, n, n <= 8 ? 30 : 10);
        const perSec = n / ms * 1000;
        const sec800 = 800 / perSec;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${label}</td><td>${n}</td><td>${ms.toFixed(1)} ms</td><td>${Math.round(perSec).toLocaleString()}</td>` +
          `<td class="${sec800 < 5 ? "ok" : "ng"}">${sec800.toFixed(1)} 秒</td>`;
        $("out").appendChild(tr);
      }
      log("完了");
    } catch (e) {
      log("失敗: " + e.message);
      if (ep === "webgpu") log("WebGPU が使えない場合は、計算を WebAssembly（CPU）にして測ってください。");
    }
    $("run").disabled = false;
    document.title = "完了";
  };
  // 動作確認用：?auto=wasm または ?auto=webgpu で、開いたらすぐ測る
  const auto = new URLSearchParams(location.search).get("auto");
  if (auto) { $("ep").value = auto; $("run").click(); }
</script>
</body>
</html>
