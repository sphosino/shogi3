<style>
/* 部屋の画面。色は shogi3.css の :root（また遊ぼのクリーム色）を使う */
body{flex-direction:column;align-items:center}
.wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--mincho);font-size:1.5rem;text-align:center;letter-spacing:.08em}
h1 a{color:inherit;text-decoration:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.1rem;color:var(--accent)}
.note{font-size:.85rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:10px 14px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line);cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 0 #8d4410}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow>*{flex:1 1 auto}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=text],input:not([type]){font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.invite{display:flex;gap:6px}.invite input{flex:1}
.choices{display:flex;gap:6px;flex-wrap:wrap}.choices button{flex:1 1 0;min-width:84px}
.choices small{display:block;font-size:.7rem;font-weight:500;color:var(--muted);letter-spacing:0}
label.check{flex-direction:row;align-items:center;font-weight:500}
.seats{display:flex;flex-direction:column;gap:6px}
.seat{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:7px 10px;background:#fff}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 2px var(--c)}
.seat .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .nm.empty{color:var(--muted);font-weight:500}
.seat .on{font-size:.75rem;color:var(--muted)}.seat .on.y{color:#23944a}
.roomrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-decoration:none;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.roomrow .who{flex:1;font-weight:700;min-width:0}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--muted)}
.tag.wait{background:#ffe2bd;color:var(--accent)}.tag.join{background:#dff3e4;color:#23944a}
.seatsm{font-size:.78rem;display:flex;gap:4px;flex-wrap:wrap}
/* 対局中 */
#game{display:flex;flex-direction:column;gap:8px}
#game #canvas-wrap{--board-off:210px} /* 盤の上下の名前の欄まで画面に収める */
.players{display:flex;gap:6px}
.pl{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 8px;font-size:.85rem}
.pl.turn{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.pl.out{opacity:.5}
.pl .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tm{font-variant-numeric:tabular-nums;font-weight:900;color:var(--muted)}
.pl.turn .tm{color:var(--ink)}.pl .tm.low{color:#c7372f}
.pl .where{font-size:.7rem;color:var(--muted)}
.pop{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:4px;background:#fff;border:2px solid var(--c);border-radius:12px;padding:3px 10px;font-weight:900;white-space:nowrap;z-index:5;animation:pop 2.2s forwards;pointer-events:none}
.pl.me .pop{bottom:auto;top:100%;margin:4px 0 0}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
#info{text-align:center;height:auto;min-height:28px;margin:0}
.stamps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stamps button{padding:5px 10px;font-size:13px;border-radius:999px}
#result .rank{display:flex;flex-direction:column;gap:6px}
#result .big{font-family:var(--mincho);font-size:1.6rem;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(360px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;text-align:center;font-weight:700}
[hidden]{display:none!important}
</style>
</head>

<div class="wrap">
  <h1><a href="shogi3.html">三人将棋</a></h1>

  <section id="game" hidden>
    <div class="players" id="topPl"></div>
    <div id="canvas-wrap"><canvas id="c"></canvas></div>
    <div class="players" id="mePl"></div>
    <div id="info"></div>
    <div class="stamps" id="stamps"></div>
    <div class="btnrow" id="gameBtns"></div>
  </section>
  <p class="foot"><a href="/">また遊ぼ</a>・<a href="shogi3.html">ひとりで指す</a>・<a href="/privacy.html">プライバシーポリシー</a></p>
</div>
<div class="toast" id="toast" hidden></div>
